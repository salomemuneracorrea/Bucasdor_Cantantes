<!-- Logo de Melodex: un micrófono blanco con una nota musical,
     dentro de un círculo con degradado morado → rosado (los colores de la página).
     Es una imagen SVG: está hecha con figuras (círculos, rectángulos y líneas),
     así se ve nítida en cualquier tamaño. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Degradado de morado (arriba a la izquierda) a rosado (abajo a la derecha) -->
    <linearGradient id="degradado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c3ce1"/>
      <stop offset="1" stop-color="#e83e8c"/>
    </linearGradient>
  </defs>

  <!-- Fondo: círculo con el degradado -->
  <circle cx="60" cy="60" r="58" fill="url(#degradado)"/>

  <!-- Micrófono: cabeza redondeada, rejilla, soporte y base -->
  <rect x="38" y="24" width="28" height="44" rx="14" fill="#ffffff"/>
  <line x1="42" y1="38" x2="62" y2="38" stroke="#e6e1f5" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="46" x2="62" y2="46" stroke="#e6e1f5" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 56 a22 22 0 0 0 44 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="52" y1="78" x2="52" y2="90" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="40" y1="92" x2="64" y2="92" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Nota musical a la derecha del micrófono -->
  <ellipse cx="84" cy="74" rx="8" ry="6" fill="#ffffff" transform="rotate(-20 84 74)"/>
  <line x1="91" y1="72" x2="91" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M91 40 q10 4 10 14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
