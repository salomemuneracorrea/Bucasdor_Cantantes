<!DOCTYPE html>
<!-- ===========================================================
     MELODEX - Buscador de cantantes - Página principal (index.html)
     Aquí está la ESTRUCTURA de la página: el título, la caja de
     búsqueda y los espacios vacíos donde JavaScript (script.js)
     va a poner los resultados. Los colores y el diseño están en
     style.css.
     =========================================================== -->
<html lang="es">
<head>
  <!-- "charset" permite usar tildes y la ñ sin que se vean mal -->
  <meta charset="UTF-8">
  <!-- Esta línea hace que la página se adapte al tamaño del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- La página es SOLO clara: así el navegador no la oscurece aunque el
       celular o el computador estén en modo oscuro -->
  <meta name="color-scheme" content="only light">
  <title>Melodex · Buscador de cantantes</title>
  <meta name="description" content="Busca cualquier cantante y conoce su foto, biografía, datos, carrera, premios, redes, canciones y álbumes.">

  <!-- Tipografía "Poppins" de Google Fonts (solo cambia cómo se ven las letras) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Ícono de la pestaña del navegador: nuestro logo (logo.svg) -->
  <link rel="icon" href="logo.svg" type="image/svg+xml">

  <!-- Conectamos la hoja de estilos (el diseño de la página) -->
  <!-- "?v=5" es la versión: al cambiarla, el navegador descarga el diseño
       nuevo en vez de usar uno viejo guardado en su memoria -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <!-- ===== ENCABEZADO: título y buscador ===== -->
  <header class="encabezado">
    <!-- Logo y nombre de la página -->
    <div class="marca">
      <img class="logo" src="logo.svg" alt="" width="64" height="64">
      <h1 class="titulo">Melodex</h1>
    </div>
    <p class="subtitulo">El buscador de cantantes: escribe un nombre y descubre su historia y sus canciones</p>

    <!-- Usamos un formulario (<form>) para que al presionar Enter también se busque -->
    <form id="formulario" class="buscador">
      <!-- La etiqueta (label) es para lectores de pantalla; está oculta visualmente -->
      <label for="caja-busqueda" class="solo-lector">Nombre del cantante</label>
      <input
        type="text"
        id="caja-busqueda"
        class="caja-busqueda"
        placeholder="Ej: Shakira, Karol G, Juanes..."
        autocomplete="off"
        list="lista-sugerencias"
        required
      >
      <!-- "datalist" es la lista de sugerencias que aparece mientras se escribe.
           JavaScript la llena con nombres de artistas de iTunes. -->
      <datalist id="lista-sugerencias"></datalist>
      <button type="submit" class="boton-buscar">Buscar</button>
    </form>
  </header>

  <!-- ===== ZONA PRINCIPAL ===== -->
  <main class="contenido">

    <!-- Aquí mostramos "Buscando..." o los mensajes de error -->
    <p id="mensaje" class="mensaje" aria-live="polite"></p>

    <!-- Contenedor de resultados. Empieza oculto (atributo "hidden")
         y JavaScript lo muestra cuando hay algo que enseñar. -->
    <section id="resultados" class="resultados" hidden>

      <!-- 1. Tarjeta principal: foto, nombre, descripción, datos clave y redes -->
      <article id="tarjeta-perfil" class="tarjeta tarjeta-perfil"></article>

      <!-- 2. Biografía (introducción completa de Wikipedia) -->
      <article id="tarjeta-biografia" class="tarjeta tarjeta-columna"></article>

      <!-- 3. Datos personales (nombre real, nacimiento, nacionalidad...) -->
      <article id="tarjeta-datos" class="tarjeta tarjeta-columna"></article>

      <!-- 4. Carrera (géneros, instrumentos, discográficas, activo desde) -->
      <article id="tarjeta-carrera" class="tarjeta tarjeta-columna"></article>

      <!-- 5. Premios (hasta 5) -->
      <article id="tarjeta-premios" class="tarjeta tarjeta-columna"></article>

      <!-- 6. Canciones populares (iTunes) -->
      <article id="tarjeta-canciones" class="tarjeta tarjeta-ancha"></article>

      <!-- 7. Álbumes (iTunes) -->
      <article id="tarjeta-albumes" class="tarjeta tarjeta-ancha"></article>
    </section>
  </main>

  <!-- ===== PIE DE PÁGINA ===== -->
  <footer class="pie">
    <strong>Melodex</strong> · Información de <a href="https://es.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a>,
    <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a> e
    <a href="https://music.apple.com" target="_blank" rel="noopener">iTunes</a>.
  </footer>

  <!-- El JavaScript va al final para que la página ya esté cargada cuando se ejecute -->
  <script src="script.js?v=5"></script>
</body>
</html>
